[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sts-learning"
version = "0.1.0"
description = "Online learning callers for sts_simulator"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
