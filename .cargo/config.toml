[target.x86_64-pc-windows-msvc]
# rustup ships this COFF linker with the Windows MSVC target. It materially
# reduces relink time for the large library-test binary without a machine-
# specific absolute path.
linker = "rust-lld"

[alias]
# Source-architecture checks deliberately live in a dependency-free helper
# package. Keeping them out of the main package prevents a 0.9 MiB source scan
# from compiling the entire simulator as an unused integration-test dependency.
architecture = ["run", "--quiet", "-p", "sts_architecture_checks", "--"]
test-core = ["test", "-p", "sts_simulator", "--lib"]
test-planner = ["test", "-p", "sts_combat_planner", "--lib"]
combat-contract = ["run", "--quiet", "--release", "-p", "sts_combat_contract", "--bin", "combat_contract", "--"]
test-control = ["test", "-p", "sts_simulator_control"]
test-runtime = ["test", "-p", "sts_oracle_runtime", "--no-default-features", "--features", "control-full", "--lib"]
check-runtime = ["check", "-p", "sts_oracle_runtime", "--no-default-features", "--features", "control-full", "--lib"]
check-workspace = ["check", "--workspace", "--all-targets", "--all-features"]
# One canonical formatting gate for local work and CI.
fmt-check = ["fmt", "--all", "--", "--check"]
# The standard release directory is the one canonical optimized oracle
# artifact. `release-final` remains available for slow deployment builds.
oracle-lab = ["run", "--quiet", "--release", "-p", "sts_oracle_lab", "--features", "canonical-oracle-artifacts", "--bin", "oracle_lab", "--", "--canonical-oracle"]
# Build-owning convenience alias. For repeated diagnostics, `./ol` invokes the
# same canonical binary directly and lets its depfile guard reject stale code.
ol = ["run", "--quiet", "--release", "-p", "sts_oracle_lab", "--features", "canonical-oracle-artifacts", "--bin", "oracle_lab", "--", "--canonical-oracle"]
# Resident mode is explicit: this lightweight client controls a dedicated
# service binary whose process lifetime preserves the in-memory combat search.
# The one-shot oracle_lab executable remains independently rebuildable.
ol-live = ["run", "--quiet", "--release", "-p", "oracle_lab_client", "--bin", "oracle_lab_client", "--", "--canonical-oracle"]
# One-process exact regression over the current A0 seed006--013 victories.
# The audit variant reports owner drift but deliberately does not turn policy
# disagreement into replay failure.
test-run-witnesses = ["run", "--quiet", "--release", "-p", "sts_oracle_lab", "--features", "canonical-oracle-artifacts", "--bin", "oracle_lab", "--", "--canonical-oracle", "verify-run-witness-suite", "--manifest", "fixtures/oracle_witnesses/a0_seed006_013_current.manifest.json"]
audit-run-witnesses = ["run", "--quiet", "--release", "-p", "sts_oracle_lab", "--features", "canonical-oracle-artifacts", "--bin", "oracle_lab", "--", "--canonical-oracle", "verify-run-witness-suite", "--manifest", "fixtures/oracle_witnesses/a0_seed006_013_current.manifest.json", "--audit-policy"]
