[target.x86_64-pc-windows-msvc]
# rustup ships this COFF linker with the Windows MSVC target. It materially
# reduces relink time for the large library-test binary without a machine-
# specific absolute path.
linker = "rust-lld"

[alias]
test-core = ["test", "-p", "sts_simulator", "--lib"]
test-agent = ["test", "-p", "sts_agent", "--lib"]
test-planner = ["test", "-p", "sts_combat_planner", "--lib"]
combat-contract = ["run", "--quiet", "--release", "-p", "sts_combat_contract", "--bin", "combat_contract", "--"]
# Keep the retained combat-search capability package explicit: Cargo does not
# run a dependency's private unit tests merely because control crates link it.
test-control = [
    "test", "-p", "sts_agent",
    "-p", "sts_combat_legacy",
    "-p", "sts_combat_search_driver",
    "-p", "sts_oracle_eval",
    "-p", "sts_oracle_learning_env",
    "-p", "sts_oracle_learning",
    "-p", "sts_oracle_run_control",
    "-p", "sts_oracle_runtime",
    "-p", "sts_oracle_tools",
    "-p", "sts_oracle_lab",
    "--no-default-features",
    "--features", "sts_combat_search_driver/backend,sts_oracle_eval/control-full,sts_oracle_run_control/control-full,sts_oracle_runtime/control-full,sts_oracle_lab/canonical-oracle-artifacts",
]
test-runtime = ["test", "-p", "sts_oracle_eval", "-p", "sts_oracle_run_control", "-p", "sts_oracle_learning_env", "-p", "sts_oracle_learning", "-p", "sts_oracle_runtime", "--no-default-features", "--features", "sts_oracle_eval/control-full,sts_oracle_run_control/control-full,sts_oracle_runtime/control-full", "--lib"]
check-runtime = ["check", "-p", "sts_oracle_eval", "-p", "sts_oracle_run_control", "-p", "sts_oracle_learning_env", "-p", "sts_oracle_learning", "-p", "sts_oracle_runtime", "--no-default-features", "--features", "sts_oracle_eval/control-full,sts_oracle_run_control/control-full,sts_oracle_runtime/control-full", "--lib"]
check-workspace = ["check", "--workspace", "--all-targets", "--all-features"]
# One canonical formatting gate for local work and CI.
fmt-check = ["fmt", "--all", "--", "--check"]
# Lightweight combat-search front door. Help and CLI-shape errors stop before
# the optimized worker feature (and therefore the simulator) is built.
combat-search = ["run", "--quiet", "-p", "sts_combat_search_driver", "--bin", "combat_search_v2", "--"]
combat-search-build = ["build", "--release", "-p", "sts_combat_search_driver", "--features", "backend", "--bin", "combat_search_v2_worker"]
# The standard release directory is the one canonical optimized oracle
# artifact. `release-final` remains available for slow deployment builds.
oracle-lab = ["run", "--quiet", "--release", "-p", "sts_oracle_lab", "--features", "canonical-oracle-artifacts", "--bin", "oracle_lab", "--", "--canonical-oracle"]
# Build-owning convenience alias. Rebuild routine V2 tooling with
# `cargo oracle-lab contract --help`; repeated calls use `.\ol.cmd`.
ol = ["run", "--quiet", "--release", "-p", "sts_oracle_lab", "--features", "canonical-oracle-artifacts", "--bin", "oracle_lab", "--", "--canonical-oracle"]
# Build-owning resident alias. Repeated calls should use `./ol-live.cmd`, which
# invokes this canonical client directly; the client itself validates its
# depfile before touching a resident workspace.
ol-live = ["run", "--quiet", "--release", "-p", "oracle_lab_client", "--bin", "oracle_lab_client", "--", "--canonical-oracle"]
