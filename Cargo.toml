[package]
name = "sts_simulator"
version = "0.1.0"
edition = "2021"
autotests = false
autobins = false
description = "Unofficial Rust Slay the Spire simulator and AI-search workspace"
readme = "README.md"
repository = "https://github.com/hewzhew/sts-sim"

[workspace]
members = [
    ".",
    "crates/oracle_lab_client",
    "crates/sts_oracle_lab",
    "crates/sts_oracle_eval",
    "crates/sts_oracle_runtime",
    "crates/oracle_lab_protocol",
    "crates/sts_combat_legacy",
    "crates/sts_combat_knowledge",
    "crates/sts_combat_contract",
    "crates/sts_combat_planner",
    "crates/sts_combat_strategy",
    "crates/sts_oracle_tools",
    "tools/architecture_checks",
]
default-members = ["."]
resolver = "2"

[dependencies]
blake2 = "0.10"
flate2 = "1.0"
rustc-hash = { version = "2.1", default-features = false }
smallvec = { version = "1.11", features = ["serde"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.test]
debug = 0

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = "off"
incremental = true
codegen-units = 64
panic = "abort"

# The command tools are thin adapters over the separately compiled runtime.
# Keep their code generation cheap without weakening the hot simulator,
# planner, or runtime crates.
[profile.release.package.sts_oracle_tools]
opt-level = 0
codegen-units = 256

[profile.release.package.sts_oracle_lab]
opt-level = 0
codegen-units = 256

[profile.release.package.sts_oracle_eval]
# Evaluation and run-control contain hot exact-search orchestration. Keep their
# optimized code generation independent from branch persistence and command IO.
opt-level = 2
codegen-units = 64

[profile.release.package.sts_oracle_runtime]
# Branch persistence and command orchestration sit outside the optimized
# simulator, planner, and evaluation kernels. Keep this adapter cheap to
# rebuild; exact search remains O2 in sts_oracle_eval and O3 below it.
opt-level = 0
codegen-units = 256

[profile.release.package.sts_combat_contract]
opt-level = 0
codegen-units = 256

# Symbolized optimized binaries for ETW/WPR sampling. Keeping this separate
# from `release` avoids invalidating canonical artifacts or making ordinary
# builds carry PDB generation cost.
[profile.profiling]
inherits = "release"
debug = 1
strip = "none"

[profile.release-final]
inherits = "release"
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = "thin"
incremental = false
codegen-units = 1
panic = "abort"

[profile.release-final.package.sts_oracle_tools]
opt-level = 3
codegen-units = 1

[profile.release-final.package.sts_oracle_lab]
opt-level = 3
codegen-units = 1

[profile.release-final.package.sts_oracle_eval]
opt-level = 3
codegen-units = 1

[profile.release-final.package.sts_oracle_runtime]
opt-level = 3
codegen-units = 1

[profile.dev-opt]
inherits = "dev"
opt-level = 1
debug = true
debug-assertions = true
overflow-checks = true
incremental = true
codegen-units = 256
