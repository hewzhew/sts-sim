[package]
name = "sts_oracle_runtime"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"
autobins = false
autotests = false

[features]
default = ["oracle-lab"]
control-full = []
oracle-lab = []

[lib]
path = "src/lib.rs"

[dependencies]
oracle_lab_protocol = { path = "../oracle_lab_protocol" }
sts_core = { package = "sts_simulator", path = "../.." }
sts_combat_legacy = { path = "../sts_combat_legacy" }
sts_combat_knowledge = { path = "../sts_combat_knowledge" }
sts_combat_planner = { path = "../sts_combat_planner" }
blake2 = "0.10"
flate2 = "1.0"
smallvec = { version = "1.11", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
