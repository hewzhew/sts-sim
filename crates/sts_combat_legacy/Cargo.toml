[package]
name = "sts_combat_legacy"
version = "0.1.0"
edition = "2021"
publish = false
autobins = false
autotests = false

[lib]
# This package is a thin compilation owner for retained source modules and has
# no crate-level rustdoc examples. Avoid launching an empty doctest target.
doctest = false

[dependencies]
sts_core = { package = "sts_simulator", path = "../.." }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
